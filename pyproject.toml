[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmd-cli"
dynamic = ["version"]
description = "把网页文章、公众号、视频字幕等链接保存成干净的 Markdown 原文 / 逐字稿。"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["markdown", "transcript", "subtitle", "wechat", "bilibili", "youtube", "obsidian", "clipper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Natural Language :: Chinese (Simplified)",
]
# Out-of-the-box: web/WeChat articles, YouTube captions; Node for the managed opencli.
dependencies = ["trafilatura>=2,<3", "youtube-transcript-api>=1.2,<2", "beautifulsoup4>=4.12", "markdownify>=0.13",
    "segno>=1.6,<2",
    # Bundled Node.js runtime for Openmd-managed opencli (browser-session routes).
    "nodejs-wheel-binaries>=22.12,<23"]

[project.urls]
Homepage = "https://github.com/baigao417/openmd"
Issues = "https://github.com/baigao417/openmd/issues"
Changelog = "https://github.com/baigao417/openmd/commits/main"

[project.optional-dependencies]
mcp = ["mcp==1.26.0"]
asr = ["faster-whisper>=1.1.0", "opencc-python-reimplemented>=0.1.7", "psutil>=5.9", "imageio-ffmpeg>=0.5,<1", "huggingface-hub>=0.27", "modelscope-hub>=0.1.8"]
media = ["yt-dlp[default]>=2026.10.26", "imageio-ffmpeg>=0.5,<1"]  # [default] brings yt-dlp-ejs for YouTube JS challenges
web = []  # kept for compatibility; trafilatura is now a core dependency
pandoc = ["pypandoc-binary>=1.14,<2"]  # optional local structure enhancement
pdf = ["markitdown[pdf]>=0.1.6"]
ocr = ["rapidocr-onnxruntime>=1.4.4", "Pillow>=10"]
ocr-router = ["Pillow>=10", "numpy>=1.24", "PyMuPDF>=1.24"]
document = ["mammoth>=1.8,<2", "python-pptx>=1.0,<2", "openpyxl>=3.1,<4", "xlrd>=2,<3", "olefile>=0.47,<1", "pdfminer.six>=20231228"]
proxy = ["PySocks>=1.7,<2"]  # Enable explicitly configured SOCKS proxies without urllib3's missing-dependency warning.
# Everything a user can opt into, in one install. Keep in sync with tests/test_extras_all.py.
all = ["openmd-cli[document,ocr,ocr-router,pandoc,media,asr,mcp,proxy]"]
# Contributors: pip install -e ".[dev]" then python -m pytest
dev = ["pytest>=8", "Pillow>=10", "numpy>=1.24", "PyMuPDF>=1.24"]  # tests also need ffmpeg on PATH

[project.scripts]
openmd = "openmd.cli:main"

[tool.setuptools.dynamic]
version = { attr = "openmd.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openmd.contracts" = ["shared_surfaces.json"]
"openmd.routing" = ["routes.json", "declarations.json", "cards/*.json"]
"openmd" = ["SKILL.md", "browser_extension/*", "browser_extension/icons/*", "browser_extension/vendor/opencli-bridge/*"]
"openmd.ocr" = ["settings.json", "ovis-prompt.txt"]
"openmd.runtime" = ["tingwu_bridge.mjs", "recommendations.json"]
"openmd.engines" = ["local_html.cjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.data-files]
"share/openmd/opencli/xiaoe" = ["integrations/opencli/xiaoe/play-url.js", "integrations/opencli/xiaoe/catalog.js", "integrations/opencli/xiaoe/content.js", "integrations/opencli/xiaoe/dispatch.js"]

"share/openmd/opencli/openmd-douyin" = ["integrations/opencli/openmd-douyin/package.json", "integrations/opencli/openmd-douyin/opencli-plugin.json", "integrations/opencli/openmd-douyin/creator-videos.ts"]
"share/openmd/opencli/openmd-xiaohongshu" = ["integrations/opencli/openmd-xiaohongshu/package.json", "integrations/opencli/openmd-xiaohongshu/opencli-plugin.json", "integrations/opencli/openmd-xiaohongshu/creator-notes.ts", "integrations/opencli/openmd-xiaohongshu/note-assets.ts"]
