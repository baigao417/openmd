name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) choco install ffmpeg -y --no-progress ;;
            macOS)   brew install ffmpeg ;;
            *)       sudo apt-get update && sudo apt-get install -y ffmpeg ;;
          esac
      - name: Install (same path contributors use)
        run: python scripts/dev_setup.py --no-venv
      - name: Test
        # Offline regression only; real-sample evidence lives in the PR description.
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          openmd --help
          openmd doctor --json --profile core
