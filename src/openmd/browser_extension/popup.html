<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Openmd</title>
<link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <div class="head">
    <span class="label" id="label">保存到</span>
    <a href="#" id="settings" class="settings-link">设置</a>
  </div>
  <p class="hint" id="opencli-browser-note" hidden>此浏览器不承担 OpenCLI 读取；需要登录态的读取请在 Chrome 里执行。Openmd 当前页面保存仍可用。</p>
  <ul id="locations" class="locations"></ul>
  <button id="snapshot" class="snapshot" type="button">保存当前页（含登录内容）</button>
  <button id="xiaoyuzhou-cookie-sync" class="snapshot" type="button" hidden>导入当前小宇宙网页登录</button>
  <section class="recent" aria-labelledby="recent-title">
    <h2 id="recent-title">最近任务</h2>
    <p id="recent-summary" class="recent-summary" role="status">正在读取最近一次结果…</p>
    <ul id="recent-jobs"></ul>
  </section>
  <p class="msg" id="msg" role="status" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
