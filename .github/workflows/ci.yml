name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # release.yml runs the full matrix before publishing

permissions:
  contents: read

jobs:
  test:
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) choco install ffmpeg -y --no-progress ;;
            macOS)   brew install ffmpeg ;;
            *)       sudo apt-get update && sudo apt-get install -y ffmpeg ;;
          esac
      - name: Install (same path contributors use)
        run: python scripts/dev_setup.py --no-venv
      - name: Test
        # Offline regression only; real-sample evidence lives in the PR description.
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install integration dependencies for generated checks
        shell: bash
        run: |
          for directory in integrations/opencli/*/; do
            if [ -f "$directory/package.json" ]; then
              if [ -f "$directory/package-lock.json" ]; then
                npm ci --prefix "$directory" --ignore-scripts --no-audit --no-fund
              else
                npm install --prefix "$directory" --ignore-scripts --no-audit --no-fund
              fi
            fi
          done
      - name: Check generated declarations
        run: python -m openmd.routing.generate --check
      - name: Build and consume wheel outside checkout
        shell: bash
        run: |
          python -m pip wheel --no-deps . -w contract-dist
          python scripts/verify_install_contract.py --wheel "$(find contract-dist -name 'openmd_cli-*.whl' -print -quit)"
      - name: Prepare pinned protocol host
        run: npm install --prefix .contract-host --ignore-scripts --no-audit --no-fund @jackwener/opencli@2.0.3
      - name: Replay external protocol without network or accounts
        run: python scripts/verify_external_contracts.py --offline --host .contract-host/node_modules/@jackwener/opencli
      - name: CLI smoke
        run: |
          openmd --help
          openmd doctor --json --profile core
