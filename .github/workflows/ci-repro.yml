name: proc-liveness-regression
on:
  push:
    branches: ["ci-debug/proc-liveness-0.1.1-20261116"]
permissions:
  contents: read
jobs:
  matrix:
    uses: ./.github/workflows/ci.yml
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python scripts/dev_setup.py --no-venv
      - name: Repeat original reproducer and pipe cancellation without rescue
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "repetitions.jsonl"
          failures = 0
          for case, count, command in (
              ("review-repro", 100, [sys.executable, "tests/fixtures/runtime/review_repro_a.py"]),
              ("pipe-sigint", 25, [sys.executable, "tests/process_ownership_scenarios.py", "pipe-sigint"]),
          ):
              case_failures = 0
              for index in range(count):
                  try:
                      result = subprocess.run(command, capture_output=True, text=True, timeout=15)
                      record = {"case": case, "iteration": index + 1, "returncode": result.returncode, "stdout": result.stdout, "stderr": result.stderr}
                  except subprocess.TimeoutExpired as exc:
                      record = {"case": case, "iteration": index + 1, "returncode": -999, "error": str(exc)}
                  with log.open("a", encoding="utf-8") as output:
                      output.write(json.dumps(record) + "\n")
                  case_failures += record["returncode"] != 0
                  if record["returncode"]:
                      print(json.dumps(record), flush=True)
              failures += case_failures
              print(f"{case}: {count - case_failures}/{count} passed", flush=True)
          assert failures == 0, f"{failures} failures; inspect artifact"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liveness-repetitions-${{ matrix.python }}
          path: ${{ runner.temp }}/repetitions.jsonl
