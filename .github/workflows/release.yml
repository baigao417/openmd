name: release

# Push a tag like v0.1.0 to publish openmd-cli to PyPI and GitHub Releases.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches package version
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/openmd/__init__.py').read_text()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package version v$version"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/openmd --help
          /tmp/smoke/bin/python -c "import importlib.resources as r; assert r.files('openmd').joinpath('browser_extension/vendor/opencli-bridge/background.js').is_file()"
      - name: Package browser extension separately from PyPI distributions
        run: python scripts/package_extension.py --output-dir extension-dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension-dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openmd-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: extension-dist/
      - name: Publish GitHub Release with the same distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sed "s/VERSION/${GITHUB_REF_NAME#v}/g" .github/release-notes.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --notes-file release-notes.md --title "Openmd $GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz extension-dist/*.zip
