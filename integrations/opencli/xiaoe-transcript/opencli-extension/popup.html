<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 520px;
      max-height: 720px;
      overflow: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #1f2937;
      background: #f7f8fb;
    }
    .shell { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
    }
    .header { display: flex; align-items: center; gap: 10px; }
    .header img { width: 28px; height: 28px; }
    .header h1 { margin: 0; font-size: 16px; }
    .subtle { color: #6b7280; font-size: 12px; }
    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: #f3f4f6;
      font-size: 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .connected { background: #22c55e; }
    .disconnected { background: #ef4444; }
    .connecting { background: #f59e0b; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b7280; margin-bottom: 8px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .field label { font-size: 12px; color: #374151; }
    .field input, .field select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: #111827;
      background: #fff;
    }
    .actions { display: flex; gap: 8px; }
    .inline-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tiny-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
    .tiny-actions button { padding: 6px 8px; font-size: 12px; }
    button {
      border: none;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    button.primary {
      background: #4f46e5;
      color: white;
      flex: 1;
    }
    button.secondary {
      background: #eef2ff;
      color: #3730a3;
    }
    button.danger {
      background: #fee2e2;
      color: #b91c1c;
    }
    button.ghost {
      background: #ecfeff;
      color: #0e7490;
      width: 100%;
      margin-top: 8px;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .title { font-weight: 600; line-height: 1.4; }
    .url { word-break: break-all; }
    .logbox {
      max-height: 160px;
      overflow: auto;
      background: #0f172a;
      color: #e5e7eb;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .hidden { display: none; }
    .hint {
      padding: 10px;
      border-radius: 10px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      line-height: 1.5;
    }
    .batch-list {
      max-height: 220px;
      overflow: auto;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #f9fafb;
    }
    .batch-row {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 1px solid #e5e7eb;
    }
    .batch-row:last-child { border-bottom: none; }
    .batch-row input { margin-top: 2px; }
    .batch-meta { color: #6b7280; font-size: 11px; margin-top: 3px; }
    .batch-empty { padding: 12px; color: #6b7280; font-size: 12px; }
    .batch-status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #374151;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card header">
      <img src="icons/icon-48.png" alt="OpenCLI">
      <div>
        <h1 id="app-title">OpenCLI Transcript</h1>
        <div class="subtle" id="app-subtitle">当前页一键转 Markdown</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">服务状态</div>
      <div class="status-grid">
        <div class="status-pill"><span class="dot disconnected" id="bridge-dot"></span><span id="bridge-text">Bridge 检查中…</span></div>
        <div class="status-pill"><span class="dot disconnected" id="helper-dot"></span><span id="helper-text">Helper 检查中…</span></div>
      </div>
      <div class="hint hidden" id="bridge-hint">Bridge 未连接时是正常现象。你在终端运行任意 <span class="mono">opencli</span> 命令后，它会自动连上。也可以直接运行：<span class="mono">E:\Git\Git\bin\bash.exe -lc &quot;opencli doctor&quot;</span></div>
      <div class="hint hidden" id="helper-hint">请先在终端运行：<span class="mono" id="helper-command">opencli xiaoe helper-start</span></div>
      <div class="actions" style="margin-top:8px;">
        <button class="secondary" id="copy-doctor-command">复制 doctor 命令</button>
        <button class="secondary" id="copy-helper-command">复制 helper 命令</button>
        <button class="danger" id="stop-current-task" disabled>停止当前任务</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">当前页面</div>
      <div class="subtle" id="page-kind"></div>
      <div class="title" id="page-title">正在识别…</div>
      <div class="subtle url" id="page-url"></div>
      <div class="subtle" id="page-reason"></div>
    </div>

    <div class="card">
      <div class="section-title">默认设置</div>
      <div class="field">
        <label for="output-dir" id="output-dir-label">默认保存目录</label>
        <input id="output-dir" type="text" />
      </div>
      <div class="field" id="provider-field">
        <label for="provider" id="provider-label">默认 Provider</label>
        <select id="provider">
          <option value="auto">auto</option>
          <option value="tingwu">tingwu</option>
          <option value="get">get</option>
        </select>
      </div>
      <div class="actions">
        <button class="secondary" id="save-config">保存默认设置</button>
        <button class="primary" id="run-current">开始转写当前页</button>
      </div>
      <div class="subtle" id="run-current-reason"></div>
    </div>

    <div class="card hidden" id="batch-card">
      <div class="section-title">批量转写（直接在扩展内选择）</div>
      <div class="field">
        <label for="batch-course-url">课程目录 URL</label>
        <input id="batch-course-url" type="text" placeholder="粘贴小鹅通课程页 URL，或打开课程页后自动带入" />
      </div>
      <div class="inline-grid">
        <div class="field">
          <label for="batch-status-filter">状态筛选</label>
          <input id="batch-status-filter" type="text" value="all" />
        </div>
        <div class="field">
          <label for="batch-type-filter">类型筛选</label>
          <input id="batch-type-filter" type="text" value="直播" />
        </div>
      </div>
      <div class="inline-grid">
        <div class="field">
          <label for="batch-chapter-filter">章节关键词</label>
          <input id="batch-chapter-filter" type="text" />
        </div>
        <div class="field">
          <label for="batch-title-filter">标题关键词</label>
          <input id="batch-title-filter" type="text" />
        </div>
      </div>
      <div class="inline-grid">
        <div class="field">
          <label for="batch-timeout">单条超时（分钟）</label>
          <input id="batch-timeout" type="number" min="1" value="180" />
        </div>
        <div class="field">
          <label for="batch-limit">读取上限（0 不限）</label>
          <input id="batch-limit" type="number" min="0" value="0" />
        </div>
      </div>
      <div class="actions">
        <button class="secondary" id="batch-load">读取目录</button>
        <button class="primary" id="batch-run">开始转写所选</button>
      </div>
      <div class="subtle" id="batch-action-reason"></div>
      <label class="subtle" style="display:flex;align-items:center;gap:6px;margin-top:8px;">
        <input id="batch-restart" type="checkbox" />
        重新开始（忽略旧 batch-state.json；切换 Provider 或筛选条件后使用）
      </label>
      <label class="subtle" style="display:flex;align-items:center;gap:6px;margin-top:8px;">
        <input id="batch-auto-load" type="checkbox" checked />
        自动读取目录（打开课程页时自动刷新列表）
      </label>
      <div class="tiny-actions">
        <span class="subtle" id="batch-count">未读取目录</span>
        <span>
          <button class="secondary" id="batch-select-all">全选</button>
          <button class="secondary" id="batch-clear-all">清空</button>
        </span>
      </div>
      <div class="batch-list" id="batch-list">
        <div class="batch-empty">先读取课程目录，然后勾选要转写的直播内容。</div>
      </div>
      <div class="batch-status" id="batch-status">批量任务状态：未开始</div>
    </div>

    <div class="card">
      <div class="section-title">最近任务</div>
      <div class="subtle" id="task-summary">暂无任务</div>
      <div class="subtle url" id="task-output"></div>
      <div class="logbox" id="task-log">等待任务状态…</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
